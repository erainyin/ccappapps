<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CCAPP 周报 HTML 排版模板</title>
</head>
<body>
  <!--
    编辑说明：
    1. 直接修改各 template 内的 HTML 结构；样式仍在 style-ccapp.css 中维护。
    2. data-template 是模板块名称，请勿删除或改名。
    3. data-slot 是重复内容插槽，data-field 是文字字段，data-html 是正文 HTML 插槽。
    4. 容器建议使用 section，避免粘贴到公众号时被拆包。
    5. 在 tool.html 点击「重载模板」，或点击「选择 HTML 模板」选择本文件，即可应用修改。
  -->

  <!-- 整页骨架：可调整头条和分类容器的先后顺序、增加页头页脚 -->
  <template data-template="page">
    <section class="wx-root">
      <section data-slot="header"></section>
      <section data-slot="headline"></section>
      <section id="quanguo" data-region="categories">
        <section data-slot="categories"></section>
      </section>
      <section data-slot="footer"></section>
    </section>
  </template>

  <!-- 页头公众号logo 引导关注的文字 -->
  <template data-template="header">
    <section id="followus"></section>
    <section id="logo"><img src="assets/logo-cap.png" alt="CCAPPlogo"></section>
    <section id="banner"><img src="assets/weekly-banner.png" alt="CCAPPbanner"></section>
  </template>

  <!-- 本周头条：对应 Markdown 中名为「本周头条」的一级标题 -->
  <template data-template="headline">
    <section id="toutiao">
      <section id="toutiao-header" data-field="headline-title"># 本周头条</section>
      <section id="toutiao-content">
        <section data-slot="news"></section>
      </section>
    </section>
  </template>

  <!-- 每个普通分类重复使用一次 -->
  <template data-template="category">
    <h1 class="category" data-field="category-title"># 全国</h1>
    <section data-slot="news"></section>
  </template>

  <!-- 每条新闻重复使用一次，头条与普通分类共用 -->
  <template data-template="news">
    <h2 class="content-title" data-field="news-title">新闻标题</h2>
    <h3 class="news-keyword" data-slot="keywords">关键词：</h3>
    <section class="news-body" data-html="body"></section>
  </template>

  <!-- 每个关键词重复使用一次 -->
  <template data-template="keyword">
    <strong class="kw-tag">关键词</strong>
  </template>

  <!-- 分类之间插入的分割线：装饰元素必须保留 &nbsp;，空的 span 会被公众号编辑器丢弃 -->
  <template data-template="divider">
    <section class="divider" aria-hidden="true">
      <span class="divider-line">&nbsp;</span>
      <span class="divider-ring">&nbsp;</span>
      <span class="divider-dot">&nbsp;</span>
      <span class="divider-line">&nbsp;</span>
    </section>
  </template>

  <!-- 页脚公众号名片-->
  <template data-template="footer">
    <section data-slot="footer-content"></section>
  </template>

</body>
</html>
