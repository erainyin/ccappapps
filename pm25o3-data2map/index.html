    <div class="container">

 <div id="modalContainer"></div>
    <script>
        var chart = echarts.init(document.getElementById('map'));
        var pm25Data = {};
        var o3Data = {};
        var currentDataType = 'PM25';
        var regionType = 'all';
        var colorConfigs = {
            PM25: {
                pieces: [
                    { min: 0, max: 5, color: 'rgba(158, 238, 104, 1)', label: '0-5' },
                    { min: 5.000001, max: 10, color: 'rgba(202, 234, 115, 1)', label: '6-10' },
                    { min: 10.000001, max: 15, color: 'rgba(223, 236, 120, 1)', label: '11-15' },
                    { min: 15.000001, max: 25, color: 'rgba(255, 247, 160, 1)', label: '16-25' },
                    { min: 25.000001, max: 30, color: 'rgba(255, 247, 160, 1)', label: '26-30' },
                    { min: 30.000001, max: 59, color: 'rgba(250, 178, 72, 1)', label: '31-59' },
                    { min: 59.000001, max: 300, color: 'rgba(239, 115, 58, 1)', label: '60-300' }
                ],
                min: 0,
                max: 300,
                title: 'PM<span class="pm25-subscript">2.5</span>浓度',
                unit: 'μg/m³'
            },
            O3: {
                pieces: [
                    { min: 0, max: 60, color: '#9EEE68', label: '0-60' },
                    { min: 60.000001, max: 100, color: '#CAEA73', label: '61-100' },
                    { min: 100.000001, max: 120, color: '#DFEC78', label: '101-120' },
                    { min: 120.000001, max: 160, color: '#ECDA76', label: '121-160' },
                    { min: 160.000001, max: 190, color: '#F0BB53', label: '161-190' },
                    { min: 190.000001, max: 220, color: '#EF733A', label: '191-220' },
                    { min: 220.000001, max: 600, color: '#D42028', label: '221-600' }
                ],
                min: 0,
                max: 600,
                title: 'O₃浓度',
                unit: 'μg/m³'
            }
        };
        var mergedGeoData = null;
        var nanhaiGeoData = null;
        var twhnGeoData = null;
        var legendVisible = false;
        var nanhaiStrokeColor = '#969696';
        var nanhaiStrokeWidth = 2.0;
        var twhnStrokeColor = '#FFFFFF';
        var twhnStrokeWidth = 1.0;
        var roamEnabled = false;
        var showLabel = false;

        function convertGeoDataToBJ54(geoData) {
            var offsetX = 500000;
            var offsetY = 3800000;
            var scale = 0.000015;
            
            function convertPoint(lng, lat) {
                var [B54, L54] = GaussProjection.wgs84ToBj54(lat, lng);
                var [X, Y] = GaussProjection.gaussForward(B54, L54, 110);
                var normX = (Y - offsetX) * scale;
                var normY = -(X - offsetY) * scale;
                return [normX, normY];
            }
            
            function convertCoords(coords) {
                if (typeof coords[0] === 'number') {
                    return convertPoint(coords[0], coords[1]);
                }
                for (var i = 0; i < coords.length; i++) {
                    coords[i] = convertCoords(coords[i]);
                }
                return coords;
            }
            
            geoData.features.forEach(function(feature) {
                if (feature.geometry && feature.geometry.coordinates) {
                    convertCoords(feature.geometry.coordinates);
                }
            });
        }
        
        var GaussProjection = {
            krasovsky: {
                a: 6378245,
                f: 1 / 298.3,
                e2: 0.006693421622966,
                e4: 0.000044605166389,
                e6: 0.000000298897949,
                e8: 0.000000001993946
            },
            wgs84: {
                a: 6378137,
                f: 1 / 298.257223563,
                e2: 0.00669437999014,
                e4: 0.000044618949,
                e6: 0.0000002983,
                e8: 0.00000000199
            },
            sevenParams: {
                dx: -108,
                dy: 56,
                dz: 103,
                rx: 0,
                ry: 0,
                rz: 0,
                m: 1
            },
            deg2rad: function(deg) {
                return deg * Math.PI / 180;
            },
            rad2deg: function(rad) {
                return rad * 180 / Math.PI;
            },
            wgs84ToBj54: function(lat, lng) {
                var params = this.sevenParams;
                var radB = this.deg2rad(lat);
                var radL = this.deg2rad(lng);
                
                var sinB = Math.sin(radB);
                var cosB = Math.cos(radB);
                var sinL = Math.sin(radL);
                var cosL = Math.cos(radL);
                
                var a = this.wgs84.a;
                var e2 = this.wgs84.e2;
                
                var N = a / Math.sqrt(1 - e2 * sinB * sinB);
                var X = N * cosB * cosL;
                var Y = N * cosB * sinL;
                var Z = N * (1 - e2) * sinB;
                
                var rx_rad = this.deg2rad(params.rx / 3600);
                var ry_rad = this.deg2rad(params.ry / 3600);
                var rz_rad = this.deg2rad(params.rz / 3600);
                
                var X54 = params.dx + X + (-rz_rad * Y + ry_rad * Z) + params.m * X;
                var Y54 = params.dy + Y + (rz_rad * X - rx_rad * Z) + params.m * Y;
                var Z54 = params.dz + Z + (-ry_rad * X + rx_rad * Y) + params.m * Z;
                
                var a54 = this.krasovsky.a;
                var e2_54 = this.krasovsky.e2;
                
                var p = Math.sqrt(X54 * X54 + Y54 * Y54);
                var B54 = Math.atan(Z54 / (p * (1 - e2_54)));
                
                var N54, sinB54;
                for (var i = 0; i < 5; i++) {
                    sinB54 = Math.sin(B54);
                    N54 = a54 / Math.sqrt(1 - e2_54 * sinB54 * sinB54);
                    B54 = Math.atan((Z54 + N54 * e2_54 * sinB54) / p);
                }
                
                sinB54 = Math.sin(B54);
                N54 = a54 / Math.sqrt(1 - e2_54 * sinB54 * sinB54);
                var L54 = Math.atan(Y54 / X54);
                
                if (X54 < 0 && Y54 >= 0) L54 += Math.PI;
                if (X54 < 0 && Y54 < 0) L54 -= Math.PI;
                
                return [this.rad2deg(B54), this.rad2deg(L54)];
            },
            bj54ToWgs84: function(B54, L54) {
                var params = this.sevenParams;
                var radB = this.deg2rad(B54);
                var radL = this.deg2rad(L54);
                
                var sinB = Math.sin(radB);
                var cosB = Math.cos(radB);
                var sinL = Math.sin(radL);
                var cosL = Math.cos(radL);
                
                var a54 = this.krasovsky.a;
                var e2_54 = this.krasovsky.e2;
                
                var N54 = a54 / Math.sqrt(1 - e2_54 * sinB * sinB);
                var X54 = N54 * cosB * cosL;
                var Y54 = N54 * cosB * sinL;
                var Z54 = N54 * (1 - e2_54) * sinB;
                
                var rx_rad = this.deg2rad(params.rx / 3600);
                var ry_rad = this.deg2rad(params.ry / 3600);
                var rz_rad = this.deg2rad(params.rz / 3600);
                
                var X = X54 - params.dx - (-rz_rad * Y54 + ry_rad * Z54) - params.m * X54;
                var Y = Y54 - params.dy - (rz_rad * X54 - rx_rad * Z54) - params.m * Y54;
                var Z = Z54 - params.dz - (-ry_rad * X54 + rx_rad * Y54) - params.m * Z54;
                
                var a = this.wgs84.a;
                var e2 = this.wgs84.e2;
                
                var p = Math.sqrt(X * X + Y * Y);
                var lat = Math.atan(Z / (p * (1 - e2)));
                
                var N, sinB;
                for (var i = 0; i < 5; i++) {
                    sinB = Math.sin(lat);
                    N = a / Math.sqrt(1 - e2 * sinB * sinB);
                    lat = Math.atan((Z + N * e2 * sinB) / p);
                }
                
                sinB = Math.sin(lat);
                N = a / Math.sqrt(1 - e2 * sinB * sinB);
                var lng = Math.atan(Y / X);
                
                if (X < 0 && Y >= 0) lng += Math.PI;
                if (X < 0 && Y < 0) lng -= Math.PI;
                
                return [this.rad2deg(lng), this.rad2deg(lat)];
            },
            gaussForward: function(B, L, L0) {
                var a = this.krasovsky.a;
                var e2 = this.krasovsky.e2;
                var e4 = this.krasovsky.e4;
                var e6 = this.krasovsky.e6;
                var e8 = this.krasovsky.e8;
                
                var radB = this.deg2rad(B);
                var radL = this.deg2rad(L);
                var radL0 = this.deg2rad(L0);
                
                var l = radL - radL0;
                
                var sinB = Math.sin(radB);
                var cosB = Math.cos(radB);
                var tanB = Math.tan(radB);
                var cotB = cosB / sinB;
                
                var N = a / Math.sqrt(1 - e2 * sinB * sinB);
                var T = tanB * tanB;
                var C = e2 * cosB * cosB / (1 - e2);
                var A = l * cosB;
                var A2 = A * A;
                var A3 = A2 * A;
                var A4 = A3 * A;
                var A5 = A4 * A;
                var A6 = A5 * A;
                
                var m0 = a * ((1 - e2 / 4 - 3 * e4 / 64 - 5 * e6 / 256) * radB
                    - (3 * e2 / 8 + 3 * e4 / 32 + 45 * e6 / 1024) * Math.sin(2 * radB)
                    + (15 * e4 / 256 + 45 * e6 / 1024) * Math.sin(4 * radB)
                    - (35 * e6 / 3072) * Math.sin(6 * radB));
                
                var x = m0 + N * tanB * (A2 / 2 + (5 - T + 9 * C + 4 * C * C) * A4 / 24

            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (line) {
                    var parts = line.split(',');
                    if (parts.length >= 3) {
                        var city = normalizeCityName(parts[0]);
                        var pm25Value = parseFloat(parts[1].trim());
                        var o3Value = parseFloat(parts[2].trim());
                        if (!isNaN(pm25Value)) {
                            pm25Result[city] = pm25Value;
                        }
                        if (!isNaN(o3Value)) {
                            o3Result[city] = o3Value;
                        }
                    }
                }
            }
            return { pm25: pm25Result, o3: o3Result };
        }

        function loadGeoJSON(url, callback) {

        function calculateBoundingBox(features, includeAdditional) {
            var minLng = Infinity, maxLng = -Infinity;
            var minLat = Infinity, maxLat = -Infinity;
            
            function processCoordinates(coords) {
                if (Array.isArray(coords)) {
                    if (coords.length === 2 && typeof coords[0] === 'number') {
                        var lng = coords[0];
                        var lat = coords[1];
                        if (lng < minLng) minLng = lng;
                        if (lng > maxLng) maxLng = lng;
                        if (lat < minLat) minLat = lat;
                        if (lat > maxLat) maxLat = lat;
                    } else {
                        for (var i = 0; i < coords.length; i++) {
                            processCoordinates(coords[i]);
                        }
                    }
                }
            }
            
            for (var i = 0; i < features.length; i++) {
                var geometry = features[i].geometry;
                if (geometry && geometry.coordinates) {
                    processCoordinates(geometry.coordinates);
                }
            }
            
            if (includeAdditional !== false) {
                if (nanhaiGeoData && nanhaiGeoData.features) {
                    for (var j = 0; j < nanhaiGeoData.features.length; j++) {
                        var nhGeometry = nanhaiGeoData.features[j].geometry;
                        if (nhGeometry && nhGeometry.coordinates) {
                            processCoordinates(nhGeometry.coordinates);
                        }
                    }
                }
                
                if (twhnGeoData && twhnGeoData.features) {
                    for (var k = 0; k < twhnGeoData.features.length; k++) {
                        var twGeometry = twhnGeoData.features[k].geometry;
                        if (twGeometry && twGeometry.coordinates) {
                            processCoordinates(twGeometry.coordinates);
                        }
                    }
                }
            }
            
            return {
                minLng: minLng,
                maxLng: maxLng,
                minLat: minLat,
                maxLat: maxLat,
                centerLng: (minLng + maxLng) / 2,
                centerLat: (minLat + maxLat) / 2,
                width: maxLng - minLng,
                height: maxLat - minLat
            };
        }

            var includeAdditional = !regionType || regionType === '';
            var bbox = calculateBoundingBox(features, includeAdditional);

            return {

            };
        }

        function mergeMunicipalities(geoData, municipalityGeoData) {
                var mCodePrefixes = ['11', '12', '31', '50'];
                
                var filteredFeatures = geoData.features.filter(function(feature) {
                    var cityCode = feature.properties.CityCode ? feature.properties.CityCode.toString() : '';
                    var outputCity = feature.properties.output_City || '';
                    
                    if (cityCode === southSeaIslandsAdcode) {
                        return false;
                    }
                    if (!outputCity) {
                        return false;
                    }
                    if (!feature.geometry || !feature.geometry.coordinates || feature.geometry.coordinates.length === 0) {
                        return false;
                    }
                    
                    var cityCodePrefix = cityCode.substring(0, 2);
                    var mCode = cityCodePrefix + '0000';
                    if (mCodePrefixes.indexOf(cityCodePrefix) !== -1 && municipalityGeoData[mCode]) {
                        return false;
                    }
                    return true;
                });
                
                var mergedFeatures = filteredFeatures;
                
                for (var i = 0; i < mCodePrefixes.length; i++) {
                    var mPrefix = mCodePrefixes[i];
                    var mCode = mPrefix + '0000';
                    var mGeoData = municipalityGeoData[mCode];
                    if (mGeoData && mGeoData.features && mGeoData.features.length > 0) {
                        mergedFeatures.push(mGeoData.features[0]);
                    }
                }
                
                return {
                    type: 'FeatureCollection',
                    features: mergedFeatures
                };
            }

        function renderBoundaryOverlay() {
            var mapWrapper = document.querySelector('.map-wrapper');
            var svgOverlay = document.querySelector('.boundary-overlay');
            if (svgOverlay) {
                svgOverlay.remove();
            }
            
            svgOverlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svgOverlay.setAttribute('class', 'boundary-overlay');
            svgOverlay.setAttribute('width', mapWrapper.offsetWidth);
            svgOverlay.setAttribute('height', mapWrapper.offsetHeight);
            mapWrapper.appendChild(svgOverlay);
            
            if (!chart) return;
            
            var coordSys = null;
            var series = chart.getModel().getSeries();
            for (var i = 0; i < series.length; i++) {
                if (series[i].coordinateSystem) {
                    coordSys = series[i].coordinateSystem;
                    break;
                }
            }
            
            if (!coordSys) return;
            
            var getPixelCoords = function(lng, lat) {
                return coordSys.dataToPoint ? coordSys.dataToPoint([lng, lat]) : [lng, lat];
            };
            
            function drawBoundary(data, color, width) {
                if (!data || !data.features || data.features.length === 0) return;
                
                var feature = data.features[0];
                var coords = feature.geometry.coordinates;
                
                function drawPath(pathCoords) {
                    if (pathCoords.length < 2) return;
                    
                    var d = '';
                    var firstPoint = getPixelCoords(pathCoords[0][0], pathCoords[0][1]);
                    d += 'M ' + firstPoint[0] + ',' + firstPoint[1];
                    
                    for (var i = 1; i < pathCoords.length; i++) {
                        var point = getPixelCoords(pathCoords[i][0], pathCoords[i][1]);
                        d += ' L ' + point[0] + ',' + point[1];
                    }
                    
                    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', d);
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke', color);
                    path.setAttribute('stroke-width', width);
                    svgOverlay.appendChild(path);
                }
                
                if (feature.geometry.type === 'MultiLineString') {
                    for (var i = 0; i < coords.length; i++) {
                        drawPath(coords[i]);
                    }
                } else {
                    drawPath(coords);
                }
            }
            
            if (nanhaiGeoData && nanhaiGeoData.features) {
                for (var i = 0; i < nanhaiGeoData.features.length; i++) {
                    var feature = nanhaiGeoData.features[i];
                    if (feature.geometry && feature.geometry.type === 'MultiLineString') {
                        var coords = feature.geometry.coordinates;
                        for (var j = 0; j < coords.length; j++) {
                            var pathCoords = coords[j];
                            if (pathCoords.length < 2) continue;
                            
                            var d = '';
                            var firstPoint = getPixelCoords(pathCoords[0][0], pathCoords[0][1]);
                            d += 'M ' + firstPoint[0] + ',' + firstPoint[1];
                            
                            for (var k = 1; k < pathCoords.length; k++) {
                                var point = getPixelCoords(pathCoords[k][0], pathCoords[k][1]);
                                d += ' L ' + point[0] + ',' + point[1];
                            }
                            
                            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                            path.setAttribute('d', d);
                            path.setAttribute('fill', 'none');
                            path.setAttribute('stroke', nanhaiStrokeColor);
                            path.setAttribute('stroke-width', nanhaiStrokeWidth);
                            svgOverlay.appendChild(path);
                        }
                    }
                }
            }
            
            if (twhnGeoData && twhnGeoData.features) {
                for (var m = 0; m < twhnGeoData.features.length; m++) {
                    var twhnFeature = twhnGeoData.features[m];
                    if (twhnFeature.geometry && twhnFeature.geometry.type === 'MultiPolygon') {
                        var twhnCoords = twhnFeature.geometry.coordinates;
                        for (var n = 0; n < twhnCoords.length; n++) {
                            var polygonCoords = twhnCoords[n];
                            for (var p = 0; p < polygonCoords.length; p++) {
                                var ringCoords = polygonCoords[p];
                                if (ringCoords.length < 2) continue;
                                
                                var d = '';
                                var firstPoint = getPixelCoords(ringCoords[0][0], ringCoords[0][1]);
                                d += 'M ' + firstPoint[0] + ',' + firstPoint[1];
                                
                                for (var q = 1; q < ringCoords.length; q++) {
                                    var point = getPixelCoords(ringCoords[q][0], ringCoords[q][1]);
                                    d += ' L ' + point[0] + ',' + point[1];
                                }
                                d += ' Z';
                                
                                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                                path.setAttribute('d', d);
                                path.setAttribute('fill', '#C8C8C8');
                                path.setAttribute('stroke', twhnStrokeColor);
                                path.setAttribute('stroke-width', twhnStrokeWidth);
                                svgOverlay.appendChild(path);
                            }
                        }
                    }
                }

        function updateDataList(filterCities) {
            var dataList = document.getElementById('data-list');
            var currentData = currentDataType === 'PM25' ? pm25Data : o3Data;
            
            var items = [];
            for (var city in currentData) {
                if (currentData.hasOwnProperty(city)) {
                    items.push({
                        city: city,
                        value: currentData[city]
                    });
                }
            }
            
            items.sort(function(a, b) {
                return b.value - a.value;
            });
            
            if (filterCities && filterCities.length > 0) {
                var filterSet = new Set(filterCities);
                items = items.filter(function(item) {
                    return filterSet.has(item.city);
                });
            }
            
            if (items.length === 0) {
                dataList.innerHTML = '<li>暂无数据</li>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < items.length; i++) {
                var highlightClass = '';
                if (currentDataType === 'PM25' && items[i].value > 25 && items[i].value <= 30) {
                    highlightClass = ' highlight-row';
                }
                html += '<li class="' + highlightClass + '"><span class="city-name">' + items[i].city + '</span><span class="city-value">' + items[i].value + '</span></li>';
            }
            dataList.innerHTML = html;
        }

        function setDateFromFileName(filename) {
            var match = filename.match(/^(\d{4})(\d{2})/);
            if (match) {
                currentYear = match[1];

                return true;
            }
            return false;
        }

        document.getElementById('csv-file-input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            
            var filename = file.name;
            if (!filename.match(/^\d{6}\.csv$/)) {
                alert('文件名格式不正确，请使用"YYYYMM.csv"格式');
                return;
            }
            
            if (setDateFromFileName(filename)) {
                loadCSVFromFile(file, function(data) {
                    pm25Data = data.pm25;
                    o3Data = data.o3;
                    var activeBtn = document.querySelector('.btn.active');
                    regionType = 'all';
                    if (activeBtn) {
                        var btnText = activeBtn.textContent;
                        if (btnText === 'JJJ') regionType = 'JJJ';
                        else if (btnText === 'CY') regionType = 'CY';
                        else if (btnText === 'FW') regionType = 'FW';
                        else if (btnText === 'CSJ') regionType = 'CSJ';
                        else if (btnText === 'ZSJ') regionType = 'ZSJ';
                    }
                    renderMap(regionType === 'all' ? null : window[regionType + 'Cities'], regionType);
                    updateTitle(regionType);
                    alert('CSV文件加载成功！');

const btnDataHandle = document.getElementById('btnDataHandle');
const modalContainer = document.getElementById('modalContainer');

// 打开弹窗
btnDataHandle.onclick = function () {
    // 清空旧弹窗
    modalContainer.innerHTML = '';
    // 生成弹窗DOM
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `
        <div class="modal-wrap">
            <div class="modal-header">
                <span>数据处理工具</span>
                <button class="modal-close">关闭</button>
            </div>
            <div class="modal-iframe-box">
                <iframe src="dataconv.html"></iframe>
            </div>
        </div>
    `;
    modalContainer.appendChild(mask);

    // 关闭按钮事件
    mask.querySelector('.modal-close').onclick = function () {
        modalContainer.innerHTML = '';
    };
    // 点击遮罩空白处关闭
    mask.onclick = function (e) {
        if (e.target === mask) {
            modalContainer.innerHTML = '';
        }
    };
};
