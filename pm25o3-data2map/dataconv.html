<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>空气质量PM25数据替换工具（同步滚动）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            padding: 20px;
            background: #f5f7fa;
        }
        .btn-group {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #btnDownloadTemplate {
            background: #607D8B;
            color: white;
        }
        #btnDownloadTemplate:hover {
            background: #546E7A;
        }
        #btnLoadMK {
            background: #2196F3;
            color: white;
        }
        #btnLoadDept {
            background: #009688;
            color: white;
        }
        #btnUpdate {
            background: #FF9800;
            color: white;
        }
        #btnExport {
            background: #4CAF50;
            color: white;
        }
        button:disabled {
            background: #cccccc !important;
            cursor: not-allowed;
        }
        input[type="file"] {
            display: none;
        }
        .table-wrap {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .table-box {
            min-width: 320px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 1px 4px #ddd;
        }
        .table-box h3 {
            padding: 12px 16px;
            background: #333;
            color: #fff;
            font-size: 15px;
        }
        .table-scroll {
            height: 400px;
            overflow-y: auto;
            will-change: scroll-position;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,
        td {
            border: 1px solid #e0e0e0;
            padding: 8px 10px;
            font-size: 13px;
            text-align: center;
        }
        th {
            background: #f0f4f9;
            position: sticky;
            top: 0;
        }
        tr.diff-row {
            background: #ffebee;
        }
        .empty-tip {
            padding: 40px 10px;
            text-align: center;
            color: #999;
        }
        /* 弹窗样式 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 13px;
            border: 1px solid #ccc;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .tip-text {
            color: #666;
            font-size: 13px;
        }
        .template-hint {
            font-size: 13px;
            color: #555;
            background: #f0f4f9;
            padding: 8px 14px;
            border-radius: 4px;
            display: inline-block;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="btn-group">
        <!-- 新增：下载模板按钮 -->
        <button id="btnDownloadTemplate">📄 下载模板</button>
        <button id="btnLoadMK">加载 MK 数据</button>
        <button id="btnLoadDept">加载部里数据（CSV文件/粘贴逗号CSV文本）</button>
        <button id="btnUpdate" disabled>更新</button>
        <button id="btnExport" disabled>导出</button>
        <span class="template-hint">模板含「排名、城市、PM25、O3」四列</span>
    </div>

    <!-- 文件输入 -->
    <input type="file" id="fileMK" accept=".csv" />
    <input type="file" id="fileDeptCsv" accept=".csv" />

    <div class="table-wrap">
        <div class="table-box">
            <h3>列表1 - MK原始数据（与列表3同步滚动）</h3>
            <div class="table-scroll" id="wrap1">
                <div class="empty-tip">请点击【加载MK数据】上传CSV</div>
            </div>
        </div>
        <div class="table-box">
            <h3>列表2 - 部里数据</h3>
            <div class="table-scroll" id="wrap2">
                <div class="empty-tip">
                    1.在豆包里上传部里数据图片。<br>
                    2.输入提示词：“图片中的内容识别处理啊并以 csv 格式输出，需要 “序号”“城市”“5 月 PM2.5 浓度（微克 / 立方米）” 三列的内容”<br>
                    3.将输出的csv文本复制。<br>
                    4.点击上传CSV或粘贴逗号表格文本导入
                </div>
            </div>
        </div>
        <div class="table-box">
            <h3>列表3 - 更新对比结果（红色=PM25变动，与列表1同步滚动）</h3>
            <div class="table-scroll" id="wrap3">
                <div class="empty-tip">两份数据加载后点更新生成</div>
            </div>
        </div>
    </div>

    <script>
        // 全局数据
        let list1Data = [];
        let list2Data = [];
        let cityPm25Map = {};
        let list3Data = [];
        let isSyncing = false;

        const btnDownloadTemplate = document.getElementById('btnDownloadTemplate');
        const btnLoadMK = document.getElementById('btnLoadMK');
        const btnLoadDept = document.getElementById('btnLoadDept');
        const btnUpdate = document.getElementById('btnUpdate');
        const btnExport = document.getElementById('btnExport');
        const fileMK = document.getElementById('fileMK');
        const fileDeptCsv = document.getElementById('fileDeptCsv');
        const wrap1 = document.getElementById('wrap1');
        const wrap2 = document.getElementById('wrap2');
        const wrap3 = document.getElementById('wrap3');

        // ========== 同步滚动绑定 ==========
        function bindSyncScroll() {
            wrap1.addEventListener('scroll', function() {
                if (isSyncing) return;
                isSyncing = true;
                wrap3.scrollTop = wrap1.scrollTop;
                setTimeout(function() { isSyncing = false; }, 50);
            });
            wrap3.addEventListener('scroll', function() {
                if (isSyncing) return;
                isSyncing = true;
                wrap1.scrollTop = wrap3.scrollTop;
                setTimeout(function() { isSyncing = false; }, 50);
            });
        }
        bindSyncScroll();

        // ========== 下载模板 ==========
        btnDownloadTemplate.onclick = function() {
            // 生成符合 MK 数据加载规则的 CSV 样例
            const header = '排名,城市,PM25,O3';
            const rows = [
                '1,北京市,25.6,120.5',
                '2,上海市,22.3,115.2',
                '3,广州市,18.7,108.3',
                '4,深圳市,16.2,102.7',
                '5,杭州市,20.1,110.4',
                '6,成都市,24.8,118.6',
                '7,武汉市,21.5,112.0',
                '8,南京市,19.4,105.8',
                '9,重庆市,23.0,116.3',
                '10,西安市,26.2,122.1'
            ];
            const csvContent = [header, ...rows].join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'MK数据模板.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        };

        // ========== 原有功能 ==========
        btnLoadMK.onclick = function() {
            fileMK.click();
        };

        btnLoadDept.onclick = function() {
            const mask = document.createElement('div');
            mask.className = 'modal-mask';
            mask.innerHTML = `
                    <div class="modal-box">
                        <h4>导入部里数据</h4>
                        <p class="tip-text">方式1：上传CSV文件；方式2：粘贴逗号分隔表格文本（如：序号,城市,PM2.5）</p>
                        <textarea id="textInput" placeholder="粘贴示例：
        序号,城市,5月PM2.5浓度（微克/立方米）
        1,北京市,23.6
        2,天津市,24.5"></textarea>
                        <div class="modal-btns">
                            <button id="uploadCsv" style="background:#009688;color:white">上传CSV</button>
                            <button id="parseText" style="background:#2196F3;color:white">解析粘贴文本</button>
                            <button id="closeModal" style="background:#999;color:white">取消</button>
                        </div>
                    </div>
                `;
            document.body.appendChild(mask);

            document.getElementById('uploadCsv').onclick = function() {
                mask.remove();
                fileDeptCsv.click();
            };
            document.getElementById('parseText').onclick = function() {
                const txt = document.getElementById('textInput').value.trim();
                mask.remove();
                if (!txt) {
                    alert("请粘贴表格文字！");
                    return;
                }
                const data = parseRawText(txt);
                if (data.length === 0) {
                    alert("未识别到有效城市，请检查逗号分隔格式");
                    return;
                }
                setList2Data(data);
                alert(`文本解析完成，共${data.length}条城市数据`);
            };
            document.getElementById('closeModal').onclick = function() {
                mask.remove();
            };
        };

        fileMK.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const text = await readFile(file);
            const data = parseCsv(text, ['排名', '城市', 'PM25', 'O3']);
            list1Data = data;
            renderTable1();
            list2Data = [];
            cityPm25Map = {};
            list3Data = [];
            renderTable2();
            renderTable3();
            btnUpdate.disabled = false;
            btnExport.disabled = true;
            alert(`MK数据加载完成，共${data.length}条`);
            fileMK.value = '';
        };

        fileDeptCsv.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const text = await readFile(file);
            const data = parseCsv(text, ['排名', '城市', 'PM25', 'O3']);
            setList2Data(data);
            alert(`CSV加载完成，共${data.length}条`);
            fileDeptCsv.value = '';
        };

        function parseRawText(text) {
            let rawLines = text.split(/\r?\n/);
            let lines = [];
            for (let i = 0; i < rawLines.length; i++) {
                let lineStr = rawLines[i].trim();
                if (lineStr !== '') {
                    lines.push(lineStr);
                }
            }
            if (lines.length <= 1) {
                return [];
            }
            const res = [];
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i];
                let cells = line.split(',');
                if (cells.length < 3) {
                    cells = line.split(/\s+/);
                }
                let idxStr = cells[0].trim();
                let cityStr = cells[1].trim();
                let pmStr = cells[2].trim();
                let pmVal = parseFloat(pmStr);
                if (!/^\d+$/.test(idxStr) || cityStr === '' || isNaN(pmVal)) {
                    continue;
                }
                res.push({
                    index: idxStr,
                    city: cityStr,
                    pm25: pmVal,
                    o3: 0
                });
            }
            return res;
        }

        function setList2Data(data) {
            list2Data = data;
            cityPm25Map = {};
            for (let i = 0; i < data.length; i++) {
                const item = data[i];
                cityPm25Map[item.city.trim()] = Number(item.pm25);
            }
            list3Data = [];
            renderTable2();
            renderTable3();
            btnExport.disabled = true;
        }

        btnUpdate.onclick = function() {
            if (list1Data.length === 0) {
                alert("请先加载MK基准数据！");
                return;
            }
            list3Data = [];
            for (let i = 0; i < list1Data.length; i++) {
                const item = list1Data[i];
                const city = item.city.trim();
                const oldPm = Number(item.pm25);
                let newPm = oldPm;
                if (cityPm25Map.hasOwnProperty(city)) {
                    newPm = cityPm25Map[city];
                }
                const isDiff = oldPm !== newPm;
                list3Data.push({
                    index: item.index,
                    city: item.city,
                    oldPm25: oldPm,
                    newPm25: newPm,
                    o3: Number(item.o3),
                    isDiff
                });
            }
            renderTable3();
            btnExport.disabled = false;
            let diffCount = 0;
            for (let i = 0; i < list3Data.length; i++) {
                if (list3Data[i].isDiff) diffCount++;
            }
            alert(`对比完成，总${list3Data.length}条，PM25变动${diffCount}条`);
        };

        btnExport.onclick = function() {
            if (!list3Data.length) {
                alert("请先生成对比结果！");
                return;
            }
            let fileName = prompt("输入导出文件名", "空气质量更新结果.csv");
            if (!fileName) return;
            if (!fileName.endsWith(".csv")) fileName += ".csv";
            let csvText = "城市,PM25,O3\n";
            for (let i = 0; i < list3Data.length; i++) {
                const row = list3Data[i];
                csvText += row.city + "," + row.newPm25 + "," + row.o3 + "\n";
            }
            const blob = new Blob([csvText], { type: "text/csv;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
        };

        function readFile(file) {
            return new Promise(function(resolve) {
                const reader = new FileReader();
                reader.readAsText(file, "utf-8");
                reader.onload = function(e) {
                    resolve(e.target.result);
                };
            });
        }

        function parseCsv(text, needCols) {
            const rawLines = text.split(/\r?\n/);
            let lines = [];
            for (let i = 0; i < rawLines.length; i++) {
                const s = rawLines[i].trim();
                if (s) lines.push(s);
            }
            if (lines.length < 2) {
                alert("CSV无有效数据");
                return [];
            }
            const header = lines[0].split(',').map(function(h) {
                return h.trim();
            });
            const idxMap = {};
            for (let i = 0; i < needCols.length; i++) {
                const col = needCols[i];
                let targetIdx = -1;
                for (let j = 0; j < header.length; j++) {
                    if (header[j].indexOf(col) > -1) {
                        targetIdx = j;
                        break;
                    }
                }
                if (targetIdx === -1) {
                    alert(`CSV缺少列：${col}`);
                    return [];
                }
                idxMap[col] = targetIdx;
            }
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const cells = lines[i].split(',');
                const city = cells[idxMap['城市']]?.trim();
                if (!city) continue;
                result.push({
                    index: cells[idxMap['排名']]?.trim(),
                    city: city,
                    pm25: parseFloat(cells[idxMap['PM25']] || 0),
                    o3: parseFloat(cells[idxMap['O3']] || 0)
                });
            }
            return result;
        }

        function renderTable1() {
            if (list1Data.length === 0) {
                wrap1.innerHTML = '<div class="empty-tip">请上传MK CSV</div>';
                return;
            }
            let html = '<table><tr><th>序号</th><th>城市</th><th>PM25</th><th>O3</th></tr>';
            for (let i = 0; i < list1Data.length; i++) {
                const item = list1Data[i];
                html += '<tr><td>' + item.index + '</td><td>' + item.city + '</td><td>' + item.pm25 + '</td><td>' + item.o3 +
                    '</td></tr>';
            }
            html += '</table>';
            wrap1.innerHTML = html;
        }

        function renderTable2() {
            if (list2Data.length === 0) {
                wrap2.innerHTML = '<div class="empty-tip">上传CSV/粘贴逗号文本导入</div>';
                return;
            }
            let html = '<table><tr><th>序号</th><th>城市</th><th>PM25</th><th>O3</th></tr>';
            for (let i = 0; i < list2Data.length; i++) {
                const item = list2Data[i];
                html += '<tr><td>' + item.index + '</td><td>' + item.city + '</td><td>' + item.pm25 + '</td><td>' + item.o3 +
                    '</td></tr>';
            }
            html += '</table>';
            wrap2.innerHTML = html;
        }

        function renderTable3() {
            if (list3Data.length === 0) {
                wrap3.innerHTML = '<div class="empty-tip">加载两份数据后点更新</div>';
                return;
            }
            let html = '<table><tr><th>序号</th><th>城市</th><th>旧PM25</th><th>PM25</th><th>O3</th></tr>';
            for (let i = 0; i < list3Data.length; i++) {
                const item = list3Data[i];
                const cls = item.isDiff ? 'diff-row' : '';
                html += '<tr class="' + cls + '"><td>' + item.index + '</td><td>' + item.city + '</td><td>' + item.oldPm25 +
                    '</td><td>' + item.newPm25 + '</td><td>' + item.o3 + '</td></tr>';
            }
            html += '</table>';
            wrap3.innerHTML = html;
        }
    </script>
</body>
</html>
